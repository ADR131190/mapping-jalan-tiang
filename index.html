<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peta Jalan Priangan Timur</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map,#app{height:100%;margin:0}#panel{position:absolute;z-index:1000;top:10px;left:10px;width:320px;max-width:calc(100% - 20px);padding:12px;background:#fff;border-radius:8px;box-shadow:0 1px 8px #5558;font:14px Arial}h3{margin:0 0 9px;font-size:17px}input,button,select{width:100%;padding:8px;margin:3px 0;border:1px solid #bbb;border-radius:4px}button{cursor:pointer;background:#1769aa;color:#fff;border:0}.hint{color:#555;font-size:12px}.status{margin-top:6px;color:#1769aa}.leaflet-popup-content{line-height:1.5}
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;z-index:2000;background:#0e2a44;display:flex;align-items:center;justify-content:center;font-family:Arial">
  <form id="loginForm" style="background:#fff;padding:28px;border-radius:10px;width:300px;max-width:90%;box-shadow:0 4px 20px #0006">
    <h3 style="margin:0 0 14px">Masuk</h3>
    <input id="loginUser" placeholder="Username" autocomplete="username" style="width:100%;padding:9px;margin:4px 0;border:1px solid #bbb;border-radius:4px">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;padding:9px;margin:4px 0;border:1px solid #bbb;border-radius:4px">
    <button type="submit" style="width:100%;padding:9px;margin-top:8px;background:#1769aa;color:#fff;border:0;border-radius:4px;cursor:pointer">Masuk</button>
    <div id="loginError" style="color:#c0392b;font-size:13px;margin-top:8px;display:none">Username atau password salah.</div>
  </form>
</div>
<div id="app" style="display:none"><div id="map"></div><section id="panel">
<h3>Jalan Priangan Timur</h3>
<input id="q" placeholder="Cari nama jalan..." autocomplete="off">
<select id="results"><option value="">-- pilih hasil pencarian --</option></select>
<input id="coord" placeholder="Koordinat: -7.327, 108.220">
<button id="go">Cari titik koordinat</button>
<div class="hint">Klik ruas untuk nama dan panjang. Data: OpenStreetMap.</div><div id="status" class="status">Memuat data...</div>
</section></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  const CRED_HASH='26d5f2fdbb97ed6cec89daa3a420a528720456afeee55876870820e373909976';
  async function sha256(text){
    const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  const SESSION_KEY='peta_priangan_auth';
  function showApp(){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    initMap();
    setTimeout(()=>{if(window.__leafletMap)window.__leafletMap.invalidateSize();},0);
  }
  if(sessionStorage.getItem(SESSION_KEY)===CRED_HASH){showApp();}
  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const u=document.getElementById('loginUser').value.trim();
    const p=document.getElementById('loginPass').value;
    const hash=await sha256(u.toLowerCase()+':'+p);
    if(hash===CRED_HASH){sessionStorage.setItem(SESSION_KEY,hash);showApp();}
    else{document.getElementById('loginError').style.display='block';}
  });
  window.initMap=function(){
const map=L.map('map').setView([-7.25,107.95],10);
window.__leafletMap=map;
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const colors=['#d73027','#4575b4','#1a9850','#762a83','#f46d43'], layers=[], all=[], lines=[];
let highlighted=null;
let roadData=null;
const status=document.getElementById('status'), q=document.getElementById('q'), results=document.getElementById('results');
function popup(r,w,index){return '<b>'+r[1]+'</b><br>Wilayah: '+w+'<br>Panjang: '+Number(r[4]).toFixed(3)+' km<br>Jumlah tiang: '+r[6].toLocaleString('id-ID')+(r[2]?'<br>Ref: '+r[2]:'')+'<br>OSM highway: '+r[3]+'<br><button style="margin-top:6px" onclick="window.__downloadKML('+index+')">Unduh KML ruas + tiang</button>';}
function escapeXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
window.__downloadKML=function(index){
 const r=all[index]; if(!r)return;
 const name=r[1]||'(tanpa nama)';
 const coords=r[5].map(p=>p[0]+','+p[1]+',0').join(' ');
 const polesOnRoad=roadData.tiang.filter(p=>p[3]===index);
 let kml='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document>\n';
 kml+='<name>'+escapeXml(name)+'</name>\n';
 kml+='<Placemark><name>'+escapeXml(name)+'</name><description>Panjang: '+Number(r[4]).toFixed(3)+' km | Jumlah tiang: '+polesOnRoad.length+'</description>';
 kml+='<Style><LineStyle><color>ff0000ff</color><width>4</width></LineStyle></Style>';
 kml+='<LineString><tessellate>1</tessellate><coordinates>'+coords+'</coordinates></LineString></Placemark>\n';
 polesOnRoad.forEach(p=>{
  kml+='<Placemark><name>'+escapeXml(p[0])+'</name><description>Koordinat: '+p[1]+', '+p[2]+'</description><Point><coordinates>'+p[2]+','+p[1]+',0</coordinates></Point></Placemark>\n';
 });
 kml+='</Document></kml>';
 const blob=new Blob([kml],{type:'application/vnd.google-earth.kml+xml'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url; a.download='ruas_'+name.replace(/[^a-z0-9]+/gi,'_')+'.kml';
 document.body.appendChild(a); a.click(); a.remove();
 URL.revokeObjectURL(url);
};
function selectRoad(index, openPopup=true){
 const r=all[index], line=lines[index]; if(!r||!line)return;
 if(highlighted)map.removeLayer(highlighted);
 highlighted=L.polyline(line.getLatLngs(),{color:'#ffd400',weight:9,opacity:.95}).addTo(map);
 highlighted.bindPopup(popup(r,roadData.wilayah[r[0]],index));
 map.fitBounds(line.getBounds(),{maxZoom:16,padding:[30,30]});
 if(openPopup)highlighted.openPopup();
}
fetch('jalan_priangan_timur_ringan.json').then(r=>{if(!r.ok)throw Error('File data tidak ditemukan');return r.json()}).then(data=>{
 roadData=data;
 data.wilayah.forEach((w,i)=>layers[i]=L.layerGroup().addTo(map));
 const poleLayer=L.layerGroup();
 const poleRenderer=L.canvas({padding:.5});
 data.jalan.forEach(r=>{const index=all.push(r)-1;const line=L.polyline(r[5].map(p=>[p[1],p[0]]),{color:colors[r[0]],weight:3,opacity:.72});lines[index]=line;line.bindPopup(popup(r,data.wilayah[r[0]],index));line.on('click',()=>selectRoad(index));line.addTo(layers[r[0]])});
 data.tiang.forEach(p=>L.circleMarker([p[1],p[2]],{radius:3,color:'#111',weight:1,fillColor:'#ff8c00',fillOpacity:.85,renderer:poleRenderer}).bindPopup('<b>Tiang</b><br>ID: '+p[0]+'<br>Koordinat: '+p[1]+', '+p[2]+'<br>Ruas: '+all[p[3]][1]).addTo(poleLayer));
 L.control.layers(null,Object.fromEntries(data.wilayah.map((w,i)=>[w,layers[i]]).concat([['Tiang ('+data.tiang.length.toLocaleString('id-ID')+')',poleLayer]]) )).addTo(map);
 status.textContent=all.length.toLocaleString('id-ID')+' ruas · '+data.tiang.length.toLocaleString('id-ID')+' tiang';
 q.oninput=()=>{const term=q.value.trim().toLowerCase();results.innerHTML='<option value="">-- pilih hasil pencarian --</option>';if(term.length<2)return;all.map((r,i)=>({r,i})).filter(x=>x.r[1].toLowerCase().includes(term)).slice(0,100).forEach(x=>{const o=document.createElement('option');o.value=x.i;o.textContent=x.r[1]+' — '+data.wilayah[x.r[0]];results.appendChild(o)})};
 results.onchange=()=>{if(results.value!=='')selectRoad(Number(results.value))};
 q.onkeydown=e=>{if(e.key==='Enter'&&results.options.length>1){results.selectedIndex=1;selectRoad(Number(results.value))}};
 document.getElementById('go').onclick=()=>{const p=document.getElementById('coord').value.split(',').map(Number);if(p.length!==2||p.some(Number.isNaN)||p[0]<-90||p[0]>90||p[1]<-180||p[1]>180){alert('Format koordinat harus: latitude, longitude');return}L.marker(p).addTo(map).bindPopup('Koordinat: '+p[0]+', '+p[1]).openPopup();map.setView(p,16)};
}).catch(e=>status.textContent='Gagal memuat: '+e.message);
  };
})();
</script></body></html>
